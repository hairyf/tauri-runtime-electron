[package]
name = "electron-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Electron acquisition and RPC glue for Rust applications"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
