name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  regressions:
    name: Script regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Check example effects and evidence diagnostics
        run: pnpm run test:checks

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libayatana-appindicator3-dev librsvg2-dev patchelf openbox xfwm4 xfconf dbus-x11 x11-utils xdotool xcompmgr
      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-
      - name: Install example tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check
        run: cargo check --locked --all-targets --all-features
      # Cargo embeds electron-rs's scripts from the pinned Git dependency.
      # Rebranding replaces the distribution; restore sandbox modes before launch.
      - name: Configure the runtime Chromium sandbox runner
        if: runner.os == 'Linux'
        run: |
          cat > "$RUNNER_TEMP/electron-runner" <<'SH'
          #!/bin/sh
          set -eu
          helper="$GITHUB_WORKSPACE/target/electron/linux-x64/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          exec "$@"
          SH
          chmod +x "$RUNNER_TEMP/electron-runner"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/electron-runner" >> "$GITHUB_ENV"
      - name: Test runtime and collect member evidence
        shell: bash
        env:
          TAURI_RUNTIME_ELECTRON_TRACE: '1'
        run: |
          output="target/runtime-evidence/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
              dbus-run-session -- sh -c 'set -eu; xfwm4 --compositor=off & xcompmgr & sleep 1; xfconf-query -c xfwm4 -p /general/button_layout -n -t string -s "|C"; test "$(xfconf-query -c xfwm4 -p /general/button_layout)" = "|C"; node tests/checks/runtime-suites.mjs "$1"' sh "$output"
          else
            node tests/checks/runtime-suites.mjs "$output"
          fi
      - name: Upload runtime member evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/runtime-evidence/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Build
        run: cargo build --locked --lib
      - name: Check official examples
        if: runner.os != 'Linux'
        run: pnpm run test:examples helloworld state resources commands isolation streaming
      - name: Check official examples under a virtual display
        if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; pnpm run test:examples helloworld state resources commands isolation streaming'
      - name: Check transparent window example
        if: runner.os == 'Windows'
        run: pnpm run test:examples transparent
      - name: Upload example evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: example-checks-${{ matrix.os }}
          path: target/example-checks/
          if-no-files-found: warn

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Check docs/coverage.md is current
        run: pnpm run test:coverage

  member-evidence:
    name: Real desktop member acceptance
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download this run's runtime assertions
        uses: actions/download-artifact@v5
        with:
          pattern: runtime-evidence-*-${{ github.run_attempt }}
          path: target/member-evidence
      - name: Report available exact-commit evidence (missing platforms stay unknown)
        run: |
          node tests/checks/coverage.mjs --md \
            --evidence target/member-evidence --commit "$GITHUB_SHA" \
            --run "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            > target/member-coverage.md
          cat target/member-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload member acceptance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-member-acceptance-${{ github.run_attempt }}
          path: target/member-coverage.md
          if-no-files-found: warn
      - name: Require 80 percent of complete desktop members
        run: |
          node tests/checks/coverage.mjs \
            --evidence target/member-evidence --commit "$GITHUB_SHA" \
            --run "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --require-platforms --require-suites --min-percent 80
