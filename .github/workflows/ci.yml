name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every platform has to stay warning-free, not just the one being developed.
  RUSTFLAGS: -D warnings
  # Keep `actions/checkout`'s `git init` from hinting about the initial branch.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # `tauri-runtime` 2.x links against the Linux webview stack even though the
      # window itself is Electron's, so its system libraries must be present.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # The build script downloads this platform's Electron release, so the
      # steps below also prove that acquisition works on every target.
      - name: Check
        run: cargo check --all-targets

      # These open a real Electron window and assert every capability
      # round-trips, so a platform that silently stops working fails here
      # instead of in a user's app. Linux has no display on the runners, hence
      # the virtual one.
      # Chromium refuses to start unless its sandbox helper is setuid root, which
      # a downloaded release archive cannot carry.
      - name: Fix the Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root target/electron/*/chrome-sandbox
          sudo chmod 4755 target/electron/*/chrome-sandbox

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test -- --nocapture

      - name: Test under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' cargo test -- --nocapture

      - name: Build
        run: cargo build --lib

  # The docs are generated from the pinned `source/tauri` submodule, so this job
  # fails whenever the implementation and docs/coverage.md disagree. That is what
  # keeps stubs and panics visible in the PR diff instead of only in the source.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check docs/coverage.md is current
        run: node scripts/coverage.mjs --check

      - name: Summarize coverage
        if: always()
        run: |
          {
            echo '### tauri-runtime coverage'
            echo '```'
            node scripts/coverage.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
