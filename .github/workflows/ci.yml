name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:
    inputs:
      examples:
        description: Space-separated official examples (empty runs all)
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A warning on one platform is invisible on the others; refuse them all.
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # The build script downloads this platform's Electron release, so the
      # steps below also prove that acquisition works on every target.
      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --lib

      - name: Coverage matrix is current
        run: |
          node scripts/coverage.mjs
          git diff --exit-code docs/coverage.md

  # Drives real Electron windows and round-trips setters through their getters.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-smoke-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-smoke-cargo-

      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libgbm1 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libgtk-3-0

      - name: Linux audio library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Smoke test (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo run --example smoke

      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo run --example smoke

  examples:
    name: examples (Windows desktop)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The official examples and their policies are the acceptance specification.
      - run: git submodule update --init --depth 1 source/tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache example dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/examples/target
            ~/AppData/Local/electron/Cache
          key: windows-examples-${{ hashFiles('Cargo.toml', 'scripts/example.mjs') }}
          restore-keys: windows-examples-

      - name: Offline regression checks
        run: |
          node scripts/verify-runner.mjs
          node scripts/verify-runtime.mjs
          node scripts/verify-theme.mjs
          node scripts/verify-api.mjs --self-check
          node scripts/verify-cases.mjs --self-check
          node scripts/verify-embedded.mjs --self-check
          node --check scripts/verify-examples.mjs
          node --check scripts/verify-native-cases.mjs
          node --check scripts/example.mjs

      # Native drag/resize and real decoded video frames supplement page CDP.
      # Screenshot inspection remains separate from automated assertion results.
      - name: Official example actions and keyframes
        env:
          EXAMPLES: ${{ inputs.examples }}
        run: |
          $examples = @($env:EXAMPLES -split '\s+' | Where-Object { $_ })
          node scripts/verify-examples.mjs @examples
          exit $LASTEXITCODE

      - name: Upload example evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-example-evidence
          path: .cache/acceptance
          if-no-files-found: error
          retention-days: 14
