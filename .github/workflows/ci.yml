name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every platform has to stay warning-free, not just the one being developed.
  RUSTFLAGS: -D warnings
  # Keep `actions/checkout`'s `git init` from hinting about the initial branch.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  regressions:
    name: Bridge and script regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      # Rust owns expectations; Node executes production JavaScript against
      # native doubles. This job needs no source submodules, Electron or GUI.
      - name: Check Electron script syntax
        run: |
          node --check electron-rs/assets/main.cjs
          node --check electron-rs/assets/preload.cjs

      - name: Test Electron bridge regressions
        run: pnpm run test:bridge:regressions

      - name: Check example effects and evidence diagnostics
        run: pnpm run test:checks

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      # `tauri-runtime` 2.x exposes Linux webview types even with Electron windows.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf openbox

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            electron-rs/target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Check
        run: cargo check --locked --all-targets --all-features

      # This private distribution is separate from the Tauri adapter's runtime.
      # Prepare before chmod: branding replaces the distribution and its modes.
      - name: Prepare real Electron bridge
        run: pnpm run test:bridge:prepare

      - name: Configure the bridge Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root target/electron-bridge/linux-x64/chrome-sandbox
          sudo chmod 4755 target/electron-bridge/linux-x64/chrome-sandbox

      - name: Test real Electron bridge
        if: runner.os != 'Linux'
        run: pnpm run test:bridge

      - name: Test real Electron bridge under a virtual display
        if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; pnpm run test:bridge'

      # A build/rebrand replaces the adapter's distribution too. Reapply the
      # sandbox owner/mode after every Cargo build and before each executable.
      - name: Configure the runtime Chromium sandbox runner
        if: runner.os == 'Linux'
        run: |
          cat > "$RUNNER_TEMP/electron-runner" <<'SH'
          #!/bin/sh
          set -eu
          helper="$GITHUB_WORKSPACE/target/electron/linux-x64/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          exec "$@"
          SH
          chmod +x "$RUNNER_TEMP/electron-runner"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/electron-runner" >> "$GITHUB_ENV"

      - name: Test runtime and adapter
        if: runner.os != 'Linux'
        env:
          TAURI_RUNTIME_ELECTRON_TRACE: '1'
        run: pnpm run test:runtime

      # Maximizing and resizing need a window manager as well as an X server.
      - name: Test runtime and adapter under a virtual display
        if: runner.os == 'Linux'
        env:
          TAURI_RUNTIME_ELECTRON_TRACE: '1'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; pnpm run test:runtime'

      - name: Build
        run: cargo build --locked --lib

      # One checker runs all six sequentially in the shared workspace.
      # Functional assertions leave visualReview pending for human review.
      - name: Check official examples
        if: runner.os != 'Linux'
        run: pnpm run test:examples helloworld state resources commands isolation streaming

      - name: Check official examples under a virtual display
        if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; pnpm run test:examples helloworld state resources commands isolation streaming'

      - name: Check transparent window example
        if: runner.os == 'Windows'
        run: pnpm run test:examples transparent

      - name: Upload example evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: example-checks-${{ matrix.os }}
          path: target/example-checks/
          if-no-files-found: warn

  # Generated from the checked-out `source/tauri` tree; keep the document current.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Check docs/coverage.md is current
        run: pnpm run test:coverage

      - name: Summarize coverage
        if: always()
        run: |
          {
            echo '### tauri-runtime coverage'
            echo '```'
            node tests/checks/coverage.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
