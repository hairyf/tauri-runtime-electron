name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every platform has to stay warning-free, not just the one being developed.
  RUSTFLAGS: -D warnings
  # Keep `actions/checkout`'s `git init` from hinting about the initial branch.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  node-regressions:
    name: Node regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Production scripts run in a VM with native objects replaced by doubles.
      # No package install, source submodules, Electron process or GUI is needed.
      - name: Check Electron script syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Check protocols and authenticated IPC
        run: node scripts/protocol-check.mjs

      - name: Check native child layout and dispatch
        run: node scripts/webview-layout-check.mjs

      - name: Check download lifecycle
        run: node scripts/download-check.mjs

      - name: Check generic webview policy and initialization
        run: node scripts/webview-policy-check.mjs

      - name: Check library window API and effects queue
        run: node scripts/window-api-check.mjs

      - name: Check native evidence failure diagnostics
        run: node scripts/example-evidence-check.mjs

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      # `tauri-runtime` 2.x links against the Linux webview stack even though the
      # window itself is Electron's, so its system libraries must be present.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf openbox

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # The build script downloads this platform's Electron release, so the
      # steps below also prove that acquisition works on every target.
      - name: Check
        run: cargo check --locked --all-targets --all-features

      # The smoke test opens a real Electron window and checks its named desktop
      # subset, reporting platform skips. Official-example GUI checks are separate.
      # Linux has no display on the runners, hence the virtual one.
      # Chromium refuses to start unless its sandbox helper is setuid root, which
      # a downloaded release archive cannot carry.
      - name: Fix the Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root target/electron/*/chrome-sandbox
          sudo chmod 4755 target/electron/*/chrome-sandbox

      - name: Test
        if: runner.os != 'Linux'
        env:
          TAURI_RUNTIME_ELECTRON_TRACE: '1'
        run: cargo test -- --nocapture

      # Maximizing and resizing are window-manager operations, and a bare X
      # server has none, so openbox runs inside the virtual display.
      - name: Test under a virtual display
        if: runner.os == 'Linux'
        env:
          TAURI_RUNTIME_ELECTRON_TRACE: '1'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; cargo test -- --nocapture'

      - name: Build
        run: cargo build --lib

      # One checker runs all six sequentially in the shared workspace.
      # Functional assertions leave visualReview pending for human review.
      - name: Check official examples
        if: runner.os != 'Linux'
        run: node scripts/example-check.mjs helloworld state resources commands isolation streaming

      - name: Check official examples under a virtual display
        if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; node scripts/example-check.mjs helloworld state resources commands isolation streaming'

      - name: Check transparent window example
        if: runner.os == 'Windows'
        run: node scripts/example-check.mjs transparent

      - name: Upload example evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: example-checks-${{ matrix.os }}
          path: target/example-checks/
          if-no-files-found: warn

  # The docs are generated from the checked-out `source/tauri` tree, so this job
  # fails whenever the implementation and docs/coverage.md disagree. That is what
  # keeps stubs and panics visible in the PR diff instead of only in the source.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check docs/coverage.md is current
        run: node scripts/coverage.mjs --check

      - name: Summarize coverage
        if: always()
        run: |
          {
            echo '### tauri-runtime coverage'
            echo '```'
            node scripts/coverage.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
