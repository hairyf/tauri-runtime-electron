name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A warning on one platform is invisible on the others; refuse them all.
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # The build script prepares this platform's Electron release, so the steps
      # below also prove that preparation works on every target.
      - name: Check
        run: cargo check --all-targets

      # The smoke test needs a display server, so it runs in its own job; this one
      # covers the unit tests and the doctests.
      - name: Test
        run: |
          cargo test --lib
          cargo test --doc

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

  # Launches a real Electron process and asserts every setter through its getter.
  # The unit tests mock the RPC boundary; this job is what proves the bridge.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-smoke-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-smoke-cargo-

      # Electron needs a display server and its own runtime libraries.
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libgbm1 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libgtk-3-0 libasound2t64

      - name: Smoke test (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo test --test smoke -- --nocapture

      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test --test smoke -- --nocapture

  # The reference crate is the contract: every file, every export and every
  # `tauri-runtime` trait member has to line up. This is the check that stops the
  # two crates drifting apart again.
  parity:
    name: parity with tauri-runtime-cef
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: git submodule update --init --depth 1 source/tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compare the crate against tauri-runtime-cef
        run: node tools/parity.mjs
