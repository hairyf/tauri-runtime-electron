[package]
name = "transparent"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "transparent"
path = "main.rs"

[workspace]

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["unstable", "compression", "common-controls-v6", "dynamic-acl", "custom-protocol"] }
tauri-runtime-electron = { path = "../../..", features = ["tauri"] }
