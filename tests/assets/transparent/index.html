<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transparent Window</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="panel">
      <header>
        <span id="drag-region" data-tauri-drag-region>透明窗口 · 拖动这里移动</span>
        <button id="minimize" type="button" aria-label="最小化窗口">−</button>
        <button id="close" type="button" aria-label="关闭窗口">×</button>
      </header>
      <section>
        <p class="eyebrow">TAURI × ELECTRON</p>
        <h1>让桌面透进来</h1>
        <p>窗口和页面底色保持透明，只调整内容面板的背景 alpha；文字与按钮不会一起变淡。</p>
        <div class="controls">
          <label class="toggle"><input id="transparency" type="checkbox" checked /> 启用透明面板</label>
          <label for="opacity">面板不透明度 <output id="opacity-value" for="opacity">72%</output></label>
          <input id="opacity" type="range" min="15" max="100" value="72" />
          <div class="effect-controls">
            <label class="toggle"><input id="blur" type="checkbox" disabled aria-busy="true" aria-describedby="blur-note" /> 系统背景模糊（Acrylic）</label>
            <button id="reset" type="button" disabled>重置</button>
          </div>
        </div>
        <p id="blur-note" class="note">正在清理并检测系统背景效果；不透明度滑块只调整面板背景。</p>
        <p id="status" role="status">正在检测系统背景效果…</p>
      </section>
    </main>
  </body>
</html>
