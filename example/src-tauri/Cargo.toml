[package]
name = "electron-api-acceptance"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["unstable", "compression", "common-controls-v6", "dynamic-acl", "devtools"] }
tauri-runtime-electron = { path = "../..", features = ["tauri"] }
