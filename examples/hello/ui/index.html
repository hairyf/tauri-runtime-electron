<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Electron Hello</title>
  </head>
  <body>
    <h1 id="heading">hello from Electron</h1>
    <script>
      // `__TAURI_INTERNALS__` is what `tauri` injects as the IPC bootstrap. Its
      // presence alone proves the initialization script ran, and the call proves
      // the `ipc://` scheme answers.
      ;(async () => {
        const { invoke } = window.__TAURI_INTERNALS__
        const race = (promise, ms) =>
          Promise.race([
            promise.then(
              (value) => `ok ${JSON.stringify(value)}`,
              (error) => `err ${error}`
            ),
            new Promise((resolve) => setTimeout(() => resolve('TIMEOUT'), ms))
          ])
        const plugin = await race(
          invoke('plugin:window|is_maximized', { label: 'main' }),
          3000
        )
        const maximized = await invoke('window_state')
        await invoke('loaded', {
          url: location.href,
          heading: document.getElementById('heading').textContent,
          plugin,
          maximized
        })
      })().catch((error) => {
        document.title = `failed: ${error}`
        console.error(error)
      })
    </script>
  </body>
</html>
