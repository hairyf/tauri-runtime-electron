[package]
name = "tauri-runtime-electron"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental Tauri runtime backend that drives an Electron main process over a local IPC socket."
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["CHANGELOG.md", "source/", "/target"]
publish = false

[dependencies]
tauri-runtime = "3.0.0-alpha.4"
tauri-utils = { version = "~3.0.0-alpha.4", features = ["resources"] }
http = "1"
cookie = "0.18"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization"] }
