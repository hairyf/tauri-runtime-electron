[package]
name = "tauri-runtime-electron"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental Tauri runtime backend that drives an Electron main process over a local IPC socket."
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["CHANGELOG.md", "source/", "/target"]
publish = false

[features]
# Only applications using the library-owned window API need Tauri itself.
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", default-features = false, features = ["unstable"], optional = true }
tauri-runtime = "2.12"
tauri-utils = { version = "2.10", features = ["resources"] }
http = "1"
cookie = "0.18"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# `tauri-runtime` 2.x exposes GTK handles in its Linux `WindowDispatch`/builder,
# so the types must be nameable even though Electron draws the window.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
